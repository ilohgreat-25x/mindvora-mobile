name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android SDK (already on the build machine)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install app packages
        run: npm ci || npm install
      - name: Add google-services.json (push notifications)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Tell the website which app version this is (from versionName)
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent='MindvoraApp/$V';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          echo "App version $V"
      - name: Copy app settings into Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mindvora-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the latest release (download link for the website)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" mindvora.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" mindvora.apk --title "Mindvora Android (build ${{ github.run_number }})" --notes "Automatic build from ${{ github.sha }}" --latest
