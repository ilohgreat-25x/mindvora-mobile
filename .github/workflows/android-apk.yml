name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android SDK (already on the build machine)
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install app packages
        run: npm ci || npm install
      - name: Add google-services.json (push notifications)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Tell the website which app version this is (from versionName)
        run: |
          V=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appendUserAgent='MindvoraApp/$V';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          echo "App version $V"
      - name: Copy app settings into Android
        run: npx cap sync android
      - name: Build signed APK (permanent Mindvora key)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mindvora-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/mindvora-release.jks"
            ./gradlew assembleRelease --no-daemon --stacktrace
            mkdir -p ../out && cp app/build/outputs/apk/release/*.apk ../out/
          else
            echo "No signing key secret - building a debug APK instead"
            ./gradlew assembleDebug --no-daemon --stacktrace
            mkdir -p ../out && cp app/build/outputs/apk/debug/*.apk ../out/
          fi
          ls -la ../out
      - name: Check the APK has the voice + notification parts
        run: |
          APK=$(ls out/*.apk | head -1)
          unzip -p "$APK" assets/capacitor.plugins.json | tee /dev/stderr | grep -q SpeechRecognition
          unzip -p "$APK" assets/capacitor.plugins.json | grep -q PushNotifications
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: mindvora-apk
          path: out/*.apk
      - name: Publish APK as the latest release (download link for the website)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls out/*.apk | head -1)
          cp "$APK" mindvora.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" mindvora.apk --title "Mindvora Android (build ${{ github.run_number }})" --notes "Mindvora for Android. Automatic build from ${{ github.sha }}. Signed with the permanent Mindvora key." --latest
